[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-affective"
version = "0.1.0"
description = "Offline-first affective computing research event primitives"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
arc-affective = "arc_affective.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
