site_name: ARC Affective
site_description: "Program badań nad multimodalnym monitorowaniem stanu afektywnego i poznawczego — projekty P01–P08"
site_author: "ARC Affective Research"
site_url: https://matpomgit.github.io/arc-affective/
repo_url: https://github.com/MatPomGit/arc-affective
repo_name: MatPomGit/arc-affective
docs_dir: docs
site_dir: site
strict: true
copyright: "ARC Affective · Projekt badawczy · dokumentacja planu i eksperymentów"

theme:
  name: material
  language: pl
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Tryb ciemny
    - scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Tryb jasny
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - pl
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

nav:
  - Start:
      - Strona główna: index.md
      - Jak korzystać: start.md
      - Portfolio publikacji: portfolio.md
  - Publikacje:
      - Wprowadzenie: papers/index.md
      - P01 · EEG i transfer: papers/P01-low-channel-transfer.md
      - P02 · Fuzja modalności: papers/P02-robust-fusion.md
      - P03 · Dryf poznawczy: papers/P03-personal-drift.md
      - P04 · Wizja RGB i prywatność: papers/P04-private-vision.md
      - P05 · Kinematyka dłoni: papers/P05-hand-workload.md
      - P06 · Adaptacyjne gry: papers/P06-adaptive-game.md
      - P07 · Interakcja z robotem: papers/P07-safe-hri.md
      - P08 · Edge AI: papers/P08-edge-systems.md
  - Metodologia:
      - Metody i ewaluacja: methodology.md
      - Zbiory danych: datasets.md
      - Aparatura i licencje: hardware.md
      - Etyka i prywatność: governance.md
      - Klasyfikacja dyscyplin: discipline-map.md
  - Architektura:
      - Architektura systemu: architecture.md
      - Mapa zależności: research-dependencies.md
  - Planowanie:
      - Kamienie milowe i issues: publication-milestones.md
      - Harmonogram prac: research-schedule.md
      - Roadmapa: roadmap.md
      - Zasady realizacji zadań: issue-operating-procedure.md
  - Rozwój:
      - Udział w projekcie: operations/contributing.md
      - Budowanie dokumentacji / Pages: operations/pages.md
