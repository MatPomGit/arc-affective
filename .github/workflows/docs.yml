name: Docs / MkDocs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "papers/**"
      - "reports/**"
      - "manuscripts/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/sync_mkdocs.py"
      - "tests/test_docs.py"
      - "tests/test_manuscripts.py"
      - "tests/test_p08_benchmark.py"
      - "tests/test_p01_registry.py"
      - "tests/test_p01_evaluation.py"
      - "tests/test_p01_uncertainty.py"
      - "tests/test_p01_controls.py"
      - "tests/test_p01_bids_qc.py"
      - "tests/test_p01_event_linkage.py"
      - "tests/test_p01_continuous.py"
      - "tests/test_p01_continuous_inference.py"
      - "tests/test_p01_faced_provenance.py"
      - "tests/test_p01_converter_qc.py"
      - "tests/test_p01_faced_preprocessing_order.py"
      - "src/arc_affective/p01_faced_preprocessing_order.py"
      - "src/arc_affective/p01_converter_qc.py"
      - "src/arc_affective/p01_faced_provenance.py"
      - "src/arc_affective/p01_continuous_inference.py"
      - "src/arc_affective/p01_continuous.py"
      - "src/arc_affective/p01_event_linkage.py"
      - "src/arc_affective/p01_bids_qc.py"
      - "src/arc_affective/p01_controls.py"
      - "src/arc_affective/p01_uncertainty.py"
      - "src/arc_affective/p01_evaluation.py"
      - "src/arc_affective/p01_registry.py"
      - "src/arc_affective/p08_benchmark.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "papers/**"
      - "reports/**"
      - "manuscripts/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/sync_mkdocs.py"
      - "tests/test_docs.py"
      - "tests/test_manuscripts.py"
      - "tests/test_p08_benchmark.py"
      - "tests/test_p01_registry.py"
      - "tests/test_p01_evaluation.py"
      - "tests/test_p01_uncertainty.py"
      - "tests/test_p01_controls.py"
      - "tests/test_p01_bids_qc.py"
      - "tests/test_p01_event_linkage.py"
      - "tests/test_p01_continuous.py"
      - "tests/test_p01_continuous_inference.py"
      - "tests/test_p01_faced_provenance.py"
      - "tests/test_p01_converter_qc.py"
      - "tests/test_p01_faced_preprocessing_order.py"
      - "src/arc_affective/p01_faced_preprocessing_order.py"
      - "src/arc_affective/p01_converter_qc.py"
      - "src/arc_affective/p01_faced_provenance.py"
      - "src/arc_affective/p01_continuous_inference.py"
      - "src/arc_affective/p01_continuous.py"
      - "src/arc_affective/p01_event_linkage.py"
      - "src/arc_affective/p01_bids_qc.py"
      - "src/arc_affective/p01_controls.py"
      - "src/arc_affective/p01_uncertainty.py"
      - "src/arc_affective/p01_evaluation.py"
      - "src/arc_affective/p01_registry.py"
      - "src/arc_affective/p08_benchmark.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate documentation / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install pinned documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Generate paper documentation from canonical proposals
        run: python scripts/sync_mkdocs.py
      - name: Validate documentation registry and local links
        run: python -m unittest discover -s tests -p 'test_docs.py' -v
      - name: Validate IEEE manuscript sources (offline)
        run: python -m unittest discover -s tests -p test_manuscripts.py -v
      - name: Validate P08 synthetic benchmark invariants
        run: python -m unittest discover -s tests -p test_p08_benchmark.py -v
      - name: Validate P01 EEG metadata manifest gate
        run: python -m unittest discover -s tests -p test_p01_registry.py -v
      - name: Validate P01 grouped synthetic baselines
        run: python -m unittest discover -s tests -p test_p01_evaluation.py -v
      - name: Validate P01 subject-level uncertainty analysis
        run: python -m unittest discover -s tests -p test_p01_uncertainty.py -v
      - name: Validate P01 synthetic negative controls
        run: python -m unittest discover -s tests -p test_p01_controls.py -v
      - name: Validate P01 BIDS sidecar metadata gate
        run: python -m unittest discover -s tests -p test_p01_bids_qc.py -v
      - name: Validate P01 event-to-stimulus metadata links
        run: python -m unittest discover -s tests -p test_p01_event_linkage.py -v
      - name: Validate P01 synthetic continuous-valence regression
        run: python -m unittest discover -s tests -p test_p01_continuous.py -v
      - name: Validate P01 continuous-valence uncertainty
        run: python -m unittest discover -s tests -p test_p01_continuous_inference.py -v
      - name: Validate P01 FACED source and derivative provenance
        run: python -m unittest discover -s tests -p test_p01_faced_provenance.py -v
      - name: Validate P01 converter source and BDF header QA
        run: python -m unittest discover -s tests -p test_p01_converter_qc.py -v
      - name: Validate FACED preprocessed-array channel correspondence
        run: python -m unittest discover -s tests -p test_p01_faced_preprocessing_order.py -v
      - name: Build strict MkDocs site
        run: mkdocs build --strict
      - name: Prepare GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload static Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
